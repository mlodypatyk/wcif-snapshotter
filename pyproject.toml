[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcif-snapshotter"
version = "0.1.0"
description = "Snapshot private WCA competition WCIF data locally and browse previous versions."
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
wcif-snapshotter = "wcif_snapshotter.cli:app"

[tool.setuptools.packages.find]
include = ["wcif_snapshotter*"]
